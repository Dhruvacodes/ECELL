<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to MES 2026!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <img src="mes_logo.png" class="logo">
  <h1>CONCLAVE LUCKY DRAW !</h1>
  <p>Part of Manipal Entrepreneurship Summit 2026</p>
</section>

<section class="guests">
  <h2>Esteemed Guests</h2>
  <div class="guest-grid">
    <div class="guest">Parul Gulati</div>
    <div class="guest">Gaurav Taneja</div>
    <div class="guest">Ankur Warikoo</div>
    <div class="guest">Shantanu Deshpande</div>
    <div class="guest">Sahiba Bali</div>
  </div>
</section>

<section class="form-section">
  <div class="card">
    <h2>Register Now!</h2>

    <form id="regForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Phone Number" pattern="[0-9]{10}" required>
      <input type="text" id="registration" placeholder="Registration Number" required>
      <button type="submit">Submit</button>
    </form>

    <p id="message"></p>
  </div>
</section>

<footer>
  <p>E-Cell MIT Manipal | MES 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
