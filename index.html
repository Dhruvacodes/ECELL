<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MES 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<div class="animated-bg"></div>
<div class="bg-blobs"></div>
<div class="floating-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-4"></div>
  <div class="shape shape-5"></div>
</div>

<section class="hero">
  <div class="hero-content">
    <img src="mes_logo.png" class="logo" alt="MES Logo">
    <h1><span class="glow-text">CONCLAVE</span></h1>
    <p class="subtitle">Manipal Entrepreneurship Summit 2026</p>
    <span class="tagline">Transforming Today, Redefining Tomorrow</span>
    <div class="scroll-indicator">
      <div class="mouse"></div>
    </div>
  </div>
</section>

<section class="speakers">
  <div class="section-label">FEATURED SPEAKERS</div>
  <h2><span class="glow-text">Meet Our Guests</span></h2>
  <div class="speaker-grid">
    <div class="speaker-card">
      <img src="assets/speakers/parul_gulati.jpg" alt="Parul Gulati">
      <h3>Parul Gulati</h3>
    </div>
    <div class="speaker-card">
      <img src="assets/speakers/gaurav_taneja.jpg" alt="Gaurav Taneja">
      <h3>Gaurav Taneja</h3>
    </div>
    <div class="speaker-card">
      <img src="assets/speakers/ankur_warikoo.jpg" alt="Ankur Warikoo">
      <h3>Ankur Warikoo</h3>
    </div>
    <div class="speaker-card">
      <img src="assets/speakers/shantanu_deshpande.jpg" alt="Shantanu Deshpande">
      <h3>Shantanu Deshpande</h3>
    </div>
    <div class="speaker-card">
      <img src="assets/speakers/sahiba_bali.jpg" alt="Sahiba Bali">
      <h3>Sahiba Bali</h3>
    </div>
  </div>
</section>

<section class="register">
  <div class="register-bg"></div>
  <div class="glass-card">
    <div class="card-glow"></div>
    <h2><span class="glow-text">Register Now</span></h2>

    <form id="regForm">
      <div class="field">
        <input type="text" id="name" required>
        <label>Full Name</label>
      </div>

      <div class="field">
        <input type="tel" id="phone" pattern="[0-9]{10}" required>
        <label>Phone Number</label>
      </div>

      <div class="field">
        <input type="text" id="registration" required>
        <label>Registration Number</label>
      </div>

      <button type="submit">Enter the Draw!</button>
    </form>

    <p id="message"></p>
  </div>
</section>

<footer>
  <p>E-Cell MIT Manipal • MES 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
